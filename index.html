<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body onload="generateGrid(15)">
    <div class="header"><h1>Etch-a-sketch</h1></div>
    <div class="toolbar">
      <btn class="pen-btm">Draw Mode</btn>
      <btn class="eraser-btn">Eraser Mode</btn>
      <input type="color" name="pen-color" id="pen-color" />
      <div class="canvas-size-slider">
        <input
          type="range"
          name="canvas-size-slider"
          id="canvas-size-slider"
          min="15"
          max="100"
          value="15"
          onchange="updateSlider(this.value)"
        />
        <span id="sliderValue">15</span>
      </div>
      <btn class="clear-btn">Clear Canvas</btn>
      <btn class="scratchcard-md-btn">Scratchcard Mode</btn>
    </div>
      <div class="canvas" id="canvas"></div>
    <div class="footer"></div>
    <script src="etch-a-sketch.js"></script>
  </body>
</html>
